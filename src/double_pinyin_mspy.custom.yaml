# 微软双拼方案补丁 —— 对齐 iOS 原生
#
# 本文件是对上游 double_pinyin_mspy.schema.yaml 的【补丁】。
# ⚠️ 不要直接改上游方案文件，否则 rime-ice 更新时会全丢。
#
# 上游方案本身已经很好（键位映射直接取自 Rime 官方 rime-double-pinyin，
# 并用带圈字母做中间桥接，避免与「大写字母参与造句」冲突），
# 所以这里只做四处必要改动。
#
# 改完需在「仓」中执行「RIME → 重新部署」生效。

patch:

  # ──────────────────────────────────────────────────────────────
  # 1. 方案显示名
  #    方案选单里一眼能认出这是我们自己那套，而不是上游原版。
  # ──────────────────────────────────────────────────────────────
  schema/name: 微软双拼 · iOS


  # ──────────────────────────────────────────────────────────────
  # 2. 挂载【完整档】词库
  #
  #    上游挂的是 rime_ice（不含 41448 大字表）。
  #    这里改挂 rime_ice_full（含大字表，192 万条）。
  #    词库文件本体是 rime_ice_full.dict.yaml，见该文件里的说明。
  #
  #    ⚠️ 两处都要改。方案里有两个地方引用词库：
  #       - translator            主翻译器（真正出候选词的地方）
  #       - radical_reverse_lookup 部件拆字反查的注音来源
  #    如果只改前者，Rime 会【同时】编译 rime_ice 和 rime_ice_full
  #    两份词库表，内存直接翻倍 —— 在完整档下这是必须避免的。
  # ──────────────────────────────────────────────────────────────
  translator/dictionary: rime_ice_full
  radical_reverse_lookup/dictionary: rime_ice_full


  # ──────────────────────────────────────────────────────────────
  # 3. 预编辑区显示：改成 iOS 原生的样子
  #
  #    上游会把双拼编码【回显成全拼】：
  #        敲 `nih`（ni + h=ang） → 显示 `ni'hang`
  #
  #    而 iOS 原生双拼显示的是你【实际敲下的按键】，即 `nih`。
  #    配合「仓」的「内嵌模式」（开启后组字直接内嵌在输入框里），
  #    这样才和原生一致。
  #
  #    💡 如果你更想借机学双拼 / 觉得全拼回显更好读：
  #       把下面这一行删掉或注释掉，就恢复上游的全拼回显。
  #       这是纯显示层的取舍，不影响输入正确性。
  #
  #    ⚠️ 副作用：preedit_format 同时影响「Ctrl+回车上屏」
  #       （commit_script_text）的结果。清空后 Ctrl+回车会上屏
  #       原始双拼编码而不是全拼。日常用不到这个键位，
  #       但如果你需要，删掉这一行即可。
  # ──────────────────────────────────────────────────────────────
  translator/preedit_format: []


  # ──────────────────────────────────────────────────────────────
  # 4. NSFW 词条屏蔽（可选，默认关闭）
  #
  #    需要 librime >= 1.14.0。效果等价于从词库里删掉这些词条，
  #    但不影响组句，也不影响用户词库 —— 比直接改词库干净得多。
  #
  #    你说了要「完整覆盖不要缺漏」，所以默认不开。
  #    如果哪天需要，去掉下面的注释即可。
  # ──────────────────────────────────────────────────────────────
  # translator/dictionary_exclude: [肏屄, 鸡巴]
