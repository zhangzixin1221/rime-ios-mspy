# iOS 原生微软双拼复刻 —— 全局配置补丁
#
# 本文件是对 default.yaml 的【补丁】。
# ⚠️ 请不要直接修改 default.yaml：上游 rime-ice 更新时会整体覆盖，改动会全丢。
#    所有自定义都写在这个文件里，这样才能安全地跟随上游更新。
#
# 改完后需在「仓」中执行「RIME → 重新部署」生效。

patch:

  # ──────────────────────────────────────────────────────────────
  # 只保留微软双拼一个方案
  #
  # 这是本项目【最重要的内存优化】。
  # rime-ice 的 default.yaml 默认启用 9 个方案（全拼、九键、自然码、
  # 智能ABC、微软、搜狗、小鹤、紫光、拼音加加）。在完整词库
  # （192 万条）下，librime 会为每个方案单独构建一份 prism，
  # 内存占用会成倍增长 —— 对 iOS 键盘扩展的内存预算而言是致命的。
  #
  # 只留 1 个方案，prism 数量从 8 降到 1。
  # 代价：方案选单（F4）里没有别的方案可切。如果需要全拼兜底，
  # 在下面加一行 `- schema: rime_ice` 即可，但要接受内存翻倍的风险。
  # ──────────────────────────────────────────────────────────────
  schema_list:
    - schema: double_pinyin_mspy

  # ──────────────────────────────────────────────────────────────
  # 候选栏
  # ──────────────────────────────────────────────────────────────
  menu:
    # 一页候选词个数。
    # iOS 原生中文键盘是「一行 + 展开箭头」，默认显示 3 个候选。
    # 这里保守用 5（雾凇默认值）。等真机对照原生键盘后，
    # 按「键位校验清单.md」第 24 题的实测结果改成 3 或保持 5。
    page_size: 5

  # ──────────────────────────────────────────────────────────────
  # 方案选单
  # ──────────────────────────────────────────────────────────────
  switcher:
    # 只剩一个方案，展开显示更直观（上游默认 true 是给多方案用的）
    fold_options: false

    # 开关记忆：这里列出的开关，在通过方案选单（F4 / #RimeSwitcher 划动）
    # 切换后会被记住。
    #
    # 两个必须知道的坑（来自「仓」官方 FAQ）：
    #   1. 需要记忆的开关，在方案里【不能】设 reset，否则每次都被重置回默认。
    #      本方案用的 rime-ice mspy 已满足（traditionalization 等均无 reset）。
    #   2. 必须通过 RimeSwitcher 切换才会记住，用快捷键/指令切不会。
    #   3. 每次「重新部署」后状态会丢失，这是预期行为。
    save_options:
      - ascii_punct         # 中英标点
      - traditionalization  # 简繁
      - emoji               # Emoji
      - full_shape          # 全角 / 半角
      - search_single_char  # 辅码查词是否单字优先
