# Rime dictionary
# encoding: utf-8
#
# ══════════════════════════════════════════════════════════════
#  自建覆盖层：补词 + 权重覆盖
# ══════════════════════════════════════════════════════════════
#
# 为什么需要这个文件？
#
#   1. 补词：审计发现有些常用词在 192 万条词库里【没有词条】。
#      没有词条 = 永远不会成为一等候选，只能靠造句拿低排位。
#
#   2. 权重覆盖：以后调词频时，不改上游的 base.dict.yaml，
#      而是把要改的词写在这里。上游更新时我们的调整不会丢。
#
# ── 格式 ─────────────────────────────────────────────────────
#
#   词<TAB>拼音<TAB>权重
#
#   ⚠️ 拼音是【全拼】，不是双拼编码！词典里存的是全拼，
#      双拼编码由方案的 speller/algebra 在部署时算出来。
#      （对照：rimes/base.dict.yaml 里是 `啊啊<TAB>a a<TAB>27365`）
#
# ── 权重怎么定 ───────────────────────────────────────────────
#
#   rime-ice 的权重尺度很大，实测（base.dict.yaml 抽样 20 万条）：
#     中位数 520 | 90 分位 15745 | 常见词 10^4 ~ 10^6
#     其他=502627  容器=188560  北京=1119506
#
#   所以给词定权重时对齐这个尺度，别用 1~100 这种小数字，
#   否则等于把词埋掉。
#
# ── 挂载位置（重要）──────────────────────────────────────────
#
#   在 rime_ice_full.dict.yaml 里被 import 到【字表之后、base 之前】。
#   上游说明「有重复词条时，最上面的权重生效」，所以放在 base 之前
#   意味着本文件的权重可以覆盖 base 里的同名词条。
#
#   ⚠️ 但「最上面的权重生效」这条我尚未实证。对【新增词条】
#      （本文件目前全部是新增）不存在重复，所以顺序无所谓；
#      等你真要用它覆盖既有词条时，务必先实测一次：
#      改一个词的权重 → 重新部署 → 看候选位次是否真的变了。
#
# ══════════════════════════════════════════════════════════════

---
name: mspy_overrides
version: "1"
...


# ──────────────────────────────────────────────────────────────
# 一、补词（审计确认：全库无词条）
#
# 来源：eval\coverage_probe.tsv 的 114 词探针审计
#       （工具 tools\New-GoldenSet.ps1，报告 eval\coverage_probe_result.tsv）
# ──────────────────────────────────────────────────────────────

# 「其它」— 全库不存在（而「其他」= 502627）。
# 注：rime-ice 应该是按校对标准把它当「其他」的异形词【故意不收】的。
#     权重给 30000，效果是打字时「其他」仍在第一位、「其它」紧随其后，
#     既能选中又不会喧宾夺主。
#     如果你是严格按规范用字、不想要这个词，直接删掉这一行。
其它	qi ta	30000

# 「帐户」— 全库不存在（规范词形是「账户」，但「帐户」在民间极常见）。
# 同样给较低权重，让规范词形优先。
帐户	zhang hu	15000

# 「向量库」— 技术术语，全库无词条（「向量」和「库」各自都在）。
# 这是真实缺口，不是异形词，所以不需要压权重。
向量库	xiang liang ku	8000


# ──────────────────────────────────────────────────────────────
# 二、权重覆盖区（目前为空）
#
# 等 golden set 采集完之后，`Evaluate-Candidates.ps1` 会输出
# 「REWEIGHTING TARGETS」清单 —— 把我们比 iOS 原生差 ≥2 位的词
# 写到这里并提高权重即可。例如：
#
#   缓存	huan cun	900000
#
# 注意：覆盖既有词条依赖「最上面的权重生效」，用前先实测（见文件头说明）。
# ──────────────────────────────────────────────────────────────


# ──────────────────────────────────────────────────────────────
# 三、词库覆盖审计的结论（备查）
#
# 探针 114 个常见词（异形词/网络新词/开发术语/口语/生活/地名）结果：
#   - 不可打字：0 个
#   - 有词条但只在 tencent 里（Rime 部署时自动注音，属正常覆盖）：
#       容器化、微前端、服务网格、边缘计算
#   - 全库无词条的：其它、帐户、向量库   ← 已在本文件补上
#
# 另外全库 416 个音节【全部】可被双拼编出（tools\Verify-SyllableCoverage.ps1），
# 所以不存在「某个音打不出字」这类覆盖漏洞。
