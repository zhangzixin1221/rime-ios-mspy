# Rime dictionary
# encoding: utf-8
#
# ══════════════════════════════════════════════════════════════
#  【完整档】雾凇拼音词库 + 41448 大字表
# ══════════════════════════════════════════════════════════════
#
# 为什么需要单独建这个文件？
#
#   上游 rime_ice.dict.yaml 里，cn_dicts/41448（Unihan 大字表）
#   默认是【注释掉】的。而词库文件（.dict.yaml）和配置文件不同 ——
#   Rime 的词库编译器只认 <name>.dict.yaml 本身，不会去读
#   <name>.dict.yaml.custom.yaml。也就是说词库【没法用补丁方式改】。
#
#   所以这里用「新增一个词库文件 + 把方案的挂载点指过来」的方式
#   实现完整档，而不是直接改上游的 rime_ice.dict.yaml。
#   好处：上游更新时直接覆盖 rime_ice.dict.yaml 即可，本档不受影响。
#
#   挂载点改在 double_pinyin_mspy.custom.yaml 里，见
#   translator/dictionary 与 radical_reverse_lookup/dictionary。
#
# 条目规模（实测统计）：
#   8105      8,610 条      41448    46,014 条
#   base    542,853 条      ext     339,327 条
#   tencent 981,936 条      others      611 条
#   ─────────────────────────────────────────────
#   中文本档合计          1,919,351 条
#   英文（另挂）             23,819 条
#   合计                  1,943,170 条
#
# ⚠️ 内存提醒：完整档是 192 万条。iOS 键盘扩展有独立的内存上限
#    （Apple 未公开，社区实测在数十 MB 量级），全量加载有被系统
#    杀进程的风险。如果真机上出现键盘弹不出/卡顿，把下面
#    cn_dicts/tencent 那一行注释掉（它一家占 98 万条、51% 的量），
#    重新部署后再测 —— 这是本档预设的降级路径。
#    更省事的做法：直接跑 build.ps1 -Tier standard 重新打包。
#
# ══════════════════════════════════════════════════════════════

---
name: rime_ice_full
version: "2026-01-26"

import_tables:
  - cn_dicts/8105     # 字表（《通用规范汉字表》+ 基本扩充）
  - cn_dicts/41448    # ★ 大字表（Unihan）—— 上游默认未启用，本档启用
  - mspy_overrides    # ★ 自建覆盖层（补词 + 权重覆盖），放在 base 之前
                      #   依据上游说明「重复词条时最上面的权重生效」
  - cn_dicts/base     # 基础词库（精校两字词，含调频）
  - cn_dicts/ext      # 扩展词库（含多音字注音）
  - cn_dicts/tencent  # 腾讯词向量大词库（部署耗时较长）
  - cn_dicts/others   # 杂项

  # 顺序说明（沿用上游约定）：有重复词条时，【最上面的权重生效】。
  # 所以字表在最上、大词库在下。
  #
  # 要挂自己的词库，加在下面即可：
  # - mydict1           # 配置目录下的 mydict1.dict.yaml
  # - cn_dicts/mydict2  # cn_dicts 目录下的 mydict2.dict.yaml
...


